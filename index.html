<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AUTO SIGN</title><link rel="stylesheet" href="style.css"></head><body><main><header><b>AUTO <i>SIGN</i></b><span id="who"></span><button id="logout" hidden>Log out</button></header><section id="login" class="box"><h1>Tuition made simple</h1><p>Sign in, or create a new Teacher / Parent account.</p><form id="loginForm"><input name="email" type="email" placeholder="Email" required><input name="password" type="password" placeholder="Password" required><button>Sign in</button></form><button class="alt" id="showRegister">Create account</button><form id="registerForm" hidden><input name="name" placeholder="Full name" required><input name="email" type="email" placeholder="Email" required><input name="password" type="password" minlength="8" placeholder="Password (8+ characters)" required><select name="role" required><option value="teacher">Teacher</option><option value="parent">Parent</option></select><button>Create account & sign in</button><button type="button" class="alt" id="showLogin">Back to sign in</button></form></section><section id="app" hidden></section></main><script src="app.js"></script></body></html>
