services:
  - type: web
    name: auto-sign
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: auto-sign-db
          property: connectionString
databases:
  - name: auto-sign-db
    plan: free
    databaseName: autosign
    user: autosign_user
